Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 262144
EndSection

Section "Monitor"
    Identifier "monitor"
    HorizSync   1.0 - 200.0
    VertRefresh  1.0 - 200.0
EndSection

Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 3840 2160
    EndSubSection
EndSection
