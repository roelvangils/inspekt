<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site not found</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 480px;
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.4;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.75rem;
        }

        .domain {
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            color: #667eea;
            word-break: break-all;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #888;
            margin-top: 1rem;
        }

        .error-code {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #555;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
        }

        @media (prefers-color-scheme: light) {
            body { background: #e8eef7; color: #444; }
            h1 { color: #1a1a1a; }
            .domain { color: #4a5cc5; }
            p { color: #666; }
            .error-code { color: #999; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#x1f50d;</div>
        <h1>This site can't be found</h1>
        <p>
            The address <span class="domain">{{DOMAIN}}</span> could not be resolved.
            Check the URL for typos and try again.
        </p>
        <span class="error-code">ERR_NAME_NOT_RESOLVED</span>
    </div>
</body>
</html>
