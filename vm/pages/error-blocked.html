<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL not available</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 480px;
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.4;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.75rem;
        }

        .url {
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            color: #667eea;
            word-break: break-all;
            font-size: 0.85rem;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #888;
            margin-top: 1rem;
        }

        @media (prefers-color-scheme: light) {
            body { background: #e8eef7; color: #444; }
            h1 { color: #1a1a1a; }
            .url { color: #4a5cc5; }
            p { color: #666; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#x1f6ab;</div>
        <h1>This URL is not available</h1>
        <p>
            <span class="url">{{URL}}</span>
        </p>
        <p>
            Internal browser pages are not accessible in this environment.
            Use the address bar to navigate to a website.
        </p>
    </div>
</body>
</html>
