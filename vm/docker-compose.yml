services:
  browser:
    build:
      context: ../..
      dockerfile: vm/Dockerfile
    container_name: inspekt-browser
    ports:
      - "6080:6080"   # noVNC web UI
      - "8888:8888"   # Control server (navigation, tabs, CDP proxy)
      - "7835:7835"   # bore tunnel server
      - "8889:8889"   # Terminal WebSocket server
      - "8890:8890"   # Overlay bus WebSocket server
    environment:
      - VNC_RESOLUTION=1280x720
      - VNC_PASSWORD=
      - HOME_URL=about:blank
    # Increase shared memory for Chromium
    shm_size: 2g
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # terminal-server.py privilege drop (setuid)
      - SETGID         # terminal-server.py privilege drop (setgid)
      - CHOWN          # entrypoint.sh chown operations
      - DAC_OVERRIDE   # Root services reading/writing all files
      - FOWNER         # chmod operations
      - KILL           # supervisord managing child processes
      - NET_ADMIN      # iptables for user network restrictions
      - NET_RAW        # Required by iptables
      - NET_BIND_SERVICE  # Bind to privileged ports (API on 80, HTTPS)
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
