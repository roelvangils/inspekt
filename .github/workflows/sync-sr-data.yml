name: Sync Screen Reader Data

# Runs weekly on Monday morning, or manually
on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Sync with a11ysupport.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pydantic

      - name: Check for upstream changes (dry run)
        id: check
        run: |
          python scripts/import_aria_at_data.py --sync --dry-run > sync_report.txt 2>&1 || true
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat sync_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check if there are changes
          if python scripts/import_aria_at_data.py --sync --dry-run 2>&1 | grep -q "No changes detected"; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Save baseline (updates the baseline file for delta comparison)
        if: steps.check.outputs.has_changes == 'true'
        run: |
          python scripts/import_aria_at_data.py --sync

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update SR data sync baseline from a11ysupport.io"
          title: "chore: screen reader data changes detected upstream"
          body: |
            ## Screen Reader Data Sync — Changes Detected

            The weekly sync found changes in [a11ysupport.io](https://a11ysupport.io)
            test results compared to last week's baseline.

            **This PR only updates the baseline file.** The curated `known-bugs.json`
            is not modified automatically — review the report below and decide if any
            changes warrant a manual update to our bug list.

            ### Sync Report

            ```
            ${{ steps.check.outputs.report }}
            ```

            ### What to do

            - **New failures**: A screen reader broke something that was working before.
              Consider adding to `known-bugs.json` if it's a significant, reproducible bug.
            - **Resolved failures**: A screen reader fixed something. Consider removing
              the corresponding entry from `known-bugs.json` if we track it.
            - **New roles**: A new ARIA role appeared on a11ysupport.io. Consider adding
              announcement templates to `announcements.json`.

            ### Files changed

            - `inspekt/data/screen-reader-rules/last-sync-baseline.json` (updated baseline)

            ---
            *Generated by [sync-sr-data.yml](.github/workflows/sync-sr-data.yml)*
          branch: chore/sync-sr-data
          delete-branch: true
          labels: |
            accessibility
            automated
