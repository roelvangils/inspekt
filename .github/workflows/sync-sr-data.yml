name: Sync Screen Reader Data

# Runs weekly on Monday morning, or manually
on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with a11ysupport.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pydantic

      - name: Check for upstream changes (dry run)
        id: check
        run: |
          python scripts/import_aria_at_data.py --sync --dry-run > sync_report.txt 2>&1 || true
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat sync_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check if there are changes
          if python scripts/import_aria_at_data.py --sync --dry-run 2>&1 | grep -q "No changes detected"; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          python scripts/import_aria_at_data.py --sync

      - name: Also run validation
        if: steps.check.outputs.has_changes == 'true'
        run: |
          python scripts/import_aria_at_data.py --check
          python scripts/import_aria_at_data.py --coverage

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync screen reader data from a11ysupport.io"
          title: "chore: sync screen reader bug data from a11ysupport.io"
          body: |
            ## Automated Screen Reader Data Sync

            This PR was automatically generated by the weekly sync workflow.
            It fetches the latest test results from [a11ysupport.io](https://a11ysupport.io)
            and updates our known bugs database.

            ### Sync Report

            ```
            ${{ steps.check.outputs.report }}
            ```

            ### What to review

            - **New bug candidates**: Verify these are real bugs, not test artifacts.
              Remove any that are false positives or already covered.
            - **Potentially fixed bugs**: Check if these bugs are truly fixed in the
              latest SR versions, or if the upstream test just wasn't run.
            - **New roles**: Consider adding announcement templates for any new roles.

            ### Data files changed

            - `inspekt/data/screen-reader-rules/known-bugs.json`

            ---
            *Generated by [sync-sr-data.yml](.github/workflows/sync-sr-data.yml)*
          branch: chore/sync-sr-data
          delete-branch: true
          labels: |
            accessibility
            automated
