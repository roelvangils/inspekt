# Inspekt Action Synonyms
# =========================
#
# This file defines synonym mappings for the `inspekt do` command.
# When you type a command like `inspekt do "go home"`, the matcher
# will expand "home" to include all its synonyms before searching.
#
# Format:
#   word:
#     - synonym1
#     - synonym2
#
# The key is the canonical term, values are alternatives that mean the same thing.
# Matching is case-insensitive.
#
# You can customize this file or create your own at a custom location
# and set it in your config.json:
#
#   {
#     "do": {
#       "synonyms-file": "~/my-synonyms.yaml"
#     }
#   }
#
# Multilingual support:
# The synonyms below include common Dutch, French, German, and Spanish terms.
# Feel free to add more languages or domain-specific terms.

