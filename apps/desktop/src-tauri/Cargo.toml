[package]
name = "inspekt-browser-vm"
version = "1.0.0"
description = "Desktop wrapper for Inspekt Browser VM"
authors = ["Inspekt Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "inspekt_browser_vm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"

window-vibrancy = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
open = "5"
url = "2"
urlencoding = "2"
objc2 = { version = "0.6.4", features = ["std"] }

# macOS native APIs for reading system accent color and accessibility settings
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSpace", "NSWorkspace", "NSWindow", "NSView", "NSVisualEffectView", "NSResponder", "NSApplication"] }
objc2-foundation = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
