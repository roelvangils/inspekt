version: '3.8'

services:
  browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspekt-browser
    ports:
      - "6080:6080"
    environment:
      - VNC_RESOLUTION=1280x720
      - VNC_PASSWORD=
      - HOME_URL=about:blank
    # Increase shared memory for Chromium
    shm_size: 2g
    restart: unless-stopped
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
