[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=warn

[program:xorg]
command=/usr/bin/Xorg %(ENV_DISPLAY)s -config /etc/X11/xorg.conf +extension RANDR -noreset
autorestart=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pulseaudio]
command=/usr/bin/pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit
autorestart=true
priority=150
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -rfbport %(ENV_VNC_PORT)s -nopw -xkb -wait 5 -xrandr
autorestart=true
priority=200
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/novnc_server --vnc localhost:%(ENV_VNC_PORT)s --listen %(ENV_NOVNC_PORT)s
autorestart=true
priority=300
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:audio-websocket]
command=/usr/bin/websockify --web=/usr/share/novnc 6081 -- /opt/audio-proxy.sh
environment=PULSE_SERVER="unix:/tmp/pulse-socket"
autorestart=true
priority=350
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=400
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:chromium]
command=/opt/inspekt-chromium.sh
environment=DISPLAY="%(ENV_DISPLAY)s",HOME_URL="%(ENV_HOME_URL)s",PULSE_SERVER="unix:/tmp/pulse-socket"
autorestart=true
priority=500
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:inspekt-bridge]
command=/opt/inspekt/.venv/bin/python -m inspekt.bridge_ws --isolated --port 8767
environment=INSPEKT_ISOLATED="1",INSPEKT_BRIDGE_URL="http://localhost:8767"
autorestart=true
priority=550
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:inspekt-api]
command=/opt/inspekt/.venv/bin/python -m uvicorn inspekt.app.api.server:app --host 0.0.0.0 --port 80
autorestart=true
priority=560
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bore-server]
command=/usr/local/bin/bore server --min-port 2000 --secret %(ENV_BORE_SECRET)s
autorestart=true
priority=570
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:control-server]
command=python3 /opt/control-server.py
autorestart=true
priority=600
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:terminal-server]
command=python3 /opt/terminal-server.py
environment=INSPEKT_BRIDGE_URL="http://localhost:8767"
autorestart=true
priority=700
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
